<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>SREDA Arctic — туристическое приложение</title>
<style>
:root{
  --blue:#4a7fa0;--blue-dark:#2f5f7a;--dark:#0f2133;--ink:#1a3147;
  --muted:#6b7f8d;--bg:#eaf3f8;--card:rgba(255,255,255,.82);
  --line:rgba(196,215,228,.9);--ice:rgba(232,244,251,.92);
  --gold:#e8993a;--green:#3da464;--red:#d05855;
  --glass-bg:rgba(255,255,255,.72);
  --glass-border:rgba(255,255,255,.55);
  --sh1:0 8px 28px rgba(15,33,51,.08);
  --sh2:0 18px 48px rgba(15,33,51,.11);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{min-height:100%;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  background:radial-gradient(ellipse at 20% 0%,#e8f4fc 0%,#ddeef7 40%,#cce0ee 100%);
  color:var(--dark);overflow-x:hidden;-webkit-font-smoothing:antialiased}

/* ── App shell ── */
.app{max-width:520px;margin:0 auto;min-height:100vh;
  background:linear-gradient(175deg,#f2f8fb 0%,#eaf2f7 55%,#e3eff5 100%);
  position:relative;box-shadow:0 0 0 1px rgba(15,33,51,.04),0 32px 80px rgba(15,33,51,.12)}

/* ── Header ── */
.header{position:sticky;top:0;z-index:20;
  background:rgba(242,249,253,.92);backdrop-filter:blur(22px) saturate(1.6);
  -webkit-backdrop-filter:blur(22px) saturate(1.6);
  border-bottom:1px solid rgba(196,215,228,.5);
  padding:calc(14px + env(safe-area-inset-top)) 18px 13px}
.topline{display:flex;align-items:center;justify-content:space-between;
  margin-bottom:10px;color:var(--muted);font-size:12px;font-weight:500;letter-spacing:.01em}
.brand{display:flex;align-items:center;gap:13px}
.logo{width:52px;height:52px;border-radius:50%;
  background:linear-gradient(145deg,#ffffff,#d8eaf4);
  border:1.5px solid rgba(255,255,255,.9);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.9),0 8px 22px rgba(74,127,160,.15);
  display:grid;place-items:center;font-weight:900;font-size:14px;letter-spacing:.06em;color:var(--blue)}
.hd-title{font-size:24px;line-height:1;font-weight:900;letter-spacing:-.04em;color:var(--dark)}
.hd-sub{font-size:12px;color:var(--muted);margin-top:4px;font-weight:400}
.status-pill{border:1px solid rgba(196,215,228,.8);background:rgba(255,255,255,.8);
  border-radius:999px;padding:6px 11px;color:#2b6cb0;font-size:11.5px;font-weight:800;
  white-space:nowrap;box-shadow:0 4px 14px rgba(74,127,160,.1)}

/* ── Content & Cards ── */
.content{padding:14px 15px 100px}
.card{background:var(--card);border:1px solid var(--line);border-radius:26px;
  padding:16px;margin-bottom:12px;
  box-shadow:var(--sh1);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.card h3{margin:0 0 8px;font-size:19px;line-height:1.1;letter-spacing:-.03em}
.card p{margin:7px 0;color:var(--muted);font-size:13.5px;line-height:1.44}

/* ── Hero card (dark) ── */
.hero{background:linear-gradient(145deg,#1c3d55,#5d8fa8);border:0;color:#fff;position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;width:200px;height:200px;
  border:28px solid rgba(255,255,255,.1);border-radius:50%;right:-90px;top:-80px}
.hero h3,.hero p,.hero .row{position:relative}
.hero p{color:rgba(255,255,255,.84)}

/* ── Home hero v15 ── */
.home-screen{display:flex;flex-direction:column;gap:13px}

.home-hero{position:relative;overflow:hidden;border-radius:28px;
  padding:18px 17px 16px;min-height:290px;border:1px solid rgba(255,255,255,.72);
  box-shadow:0 20px 52px rgba(74,120,180,.22),inset 0 1px 0 rgba(255,255,255,.18);
  background:
    linear-gradient(190deg,rgba(10,38,90,.22) 0%,rgba(8,28,68,.08) 38%,transparent 56%),
    radial-gradient(ellipse at 68% 10%,rgba(80,220,200,.62) 0%,transparent 22%),
    radial-gradient(ellipse at 55% 18%,rgba(120,210,255,.55) 0%,transparent 26%),
    radial-gradient(ellipse at 78% 6%,rgba(60,255,210,.38) 0%,transparent 14%),
    radial-gradient(ellipse at 40% 14%,rgba(100,180,255,.42) 0%,transparent 20%),
    linear-gradient(135deg,#1e5cbf 0%,#3a82d4 28%,#6aaae8 56%,#a8cff0 100%)}

/* snow-glass bottom fade */
.home-hero:before{content:"";position:absolute;inset:0;
  background:
    radial-gradient(ellipse at 80% 95%,rgba(255,255,255,.28),transparent 36%),
    linear-gradient(180deg,transparent 44%,rgba(210,232,248,.65) 75%,rgba(224,240,252,.92) 100%);
  pointer-events:none;z-index:1}

/* mountain silhouette layers */
.mtn-far{position:absolute;left:0;right:0;bottom:0;height:52%;z-index:2;
  background:linear-gradient(180deg,rgba(12,40,90,.0),rgba(12,38,86,.34) 38%,rgba(10,32,76,.72) 100%);
  clip-path:polygon(
    0 100%, 0 72%, 5% 64%, 10% 68%, 16% 52%, 22% 58%, 28% 40%,
    33% 46%, 40% 28%, 45% 34%, 51% 18%, 57% 26%, 63% 12%,
    68% 20%, 74% 8%, 80% 16%, 85% 6%, 90% 14%, 95% 4%,
    100% 10%, 100% 100%)}
.mtn-mid{position:absolute;left:0;right:0;bottom:0;height:40%;z-index:3;
  background:linear-gradient(180deg,rgba(16,44,98,.0),rgba(15,41,94,.55) 28%,rgba(12,35,82,.88) 100%);
  clip-path:polygon(
    0 100%, 0 82%, 7% 70%, 13% 76%, 20% 60%, 26% 66%, 34% 50%,
    40% 58%, 48% 38%, 54% 46%, 62% 30%, 68% 38%, 76% 22%,
    82% 30%, 88% 18%, 94% 26%, 100% 15%, 100% 100%)}
.mtn-near{position:absolute;left:0;right:0;bottom:0;height:26%;z-index:4;
  background:linear-gradient(180deg,rgba(8,28,72,.18),rgba(8,26,66,.82) 32%,rgba(6,22,58,.98) 100%);
  clip-path:polygon(
    0 100%, 0 88%, 8% 76%, 15% 84%, 22% 68%, 30% 78%, 38% 60%,
    45% 70%, 52% 52%, 58% 62%, 66% 44%, 72% 54%, 80% 38%,
    86% 48%, 92% 35%, 97% 44%, 100% 32%, 100% 100%)}
.mtn-snow{position:absolute;left:0;right:0;bottom:0;height:18%;z-index:5;
  background:linear-gradient(180deg,rgba(200,225,248,.0),rgba(215,235,252,.28) 55%,rgba(224,240,255,.72) 100%);
  clip-path:polygon(
    0 100%, 0 92%, 8% 84%, 15% 90%, 22% 80%, 30% 88%, 38% 74%,
    45% 82%, 52% 68%, 58% 76%, 66% 62%, 72% 72%, 80% 58%,
    86% 68%, 92% 56%, 97% 66%, 100% 54%, 100% 100%)}

.home-hero>*{position:relative;z-index:6}
.eyebrow{display:inline-flex;align-items:center;gap:6px;
  background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.28);
  border-radius:999px;padding:7px 11px;font-size:11px;font-weight:800;
  color:rgba(255,255,255,.94);letter-spacing:.02em;width:max-content;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.18)}
.home-hero h3{font-size:28px;line-height:1.02;margin:13px 0 9px;
  letter-spacing:-.055em;color:#fff;max-width:300px;text-shadow:0 2px 12px rgba(10,30,80,.22)}
.home-hero p{font-size:13px;line-height:1.44;color:rgba(255,255,255,.9);
  max-width:288px;margin:0 0 0}
.hero-btns{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-top:74px}
.glass-btn{display:flex;align-items:center;gap:10px;padding:14px 13px;border-radius:20px;
  border:1px solid rgba(255,255,255,.3);background:rgba(230,244,255,.16);color:#fff;
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 4px 16px rgba(10,28,80,.14);
  cursor:pointer;text-align:left;transition:background .18s}
.glass-btn:hover{background:rgba(230,244,255,.24)}
.glass-btn .g-ico{width:32px;height:32px;display:grid;place-items:center;
  border-radius:13px;background:rgba(255,255,255,.14);font-size:17px;flex:0 0 32px}
.glass-btn b{display:block;font-size:14px;line-height:1.1;font-weight:800}
.glass-btn span{display:block;font-size:11px;color:rgba(255,255,255,.82);margin-top:3px;line-height:1.2}

/* ── KPI row ── */
.kpi-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.kpi-box{display:flex;align-items:center;justify-content:space-between;
  background:var(--card);border:1px solid var(--line);border-radius:22px;
  padding:13px 13px;box-shadow:var(--sh1);backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);cursor:pointer;transition:transform .18s}
.kpi-box:active{transform:scale(.97)}
.kpi-box b{display:block;font-size:15.5px;font-weight:900;letter-spacing:-.03em;line-height:1.05;color:var(--dark)}
.kpi-box span{display:block;font-size:10.5px;color:var(--muted);line-height:1.22;margin-top:5px}
.kpi-ico{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;
  background:linear-gradient(145deg,#eef6fc,#daeaf5);font-size:16px;
  box-shadow:inset 0 1px 0 #fff,0 2px 8px rgba(74,127,160,.1)}

/* ── Dashboard grid ── */
.dash{display:grid;grid-template-columns:1.15fr .85fr;gap:10px}
.plan-card{padding:16px;border-radius:26px}
.plan-card h3{font-size:17px;margin:0 0 12px;letter-spacing:-.03em}

/* Timeline */
.timeline{position:relative;padding-left:21px}
.timeline:before{content:"";position:absolute;left:7px;top:6px;bottom:8px;
  width:2px;background:linear-gradient(180deg,var(--blue) 0%,var(--line) 100%);border-radius:2px;opacity:.5}
.step{position:relative;margin-bottom:15px;cursor:pointer}
.step:before{content:"";position:absolute;left:-19px;top:5px;
  width:13px;height:13px;border-radius:50%;background:var(--blue);
  box-shadow:0 0 0 4px rgba(74,127,160,.14),0 2px 6px rgba(74,127,160,.22)}
.step.done:before{background:var(--green);box-shadow:0 0 0 4px rgba(61,164,100,.14)}
.step.warn:before{background:var(--gold);box-shadow:0 0 0 4px rgba(232,153,58,.16)}
.step b{display:block;font-size:13.5px;line-height:1.24;color:var(--dark);font-weight:700}
.step span{display:block;color:var(--muted);font-size:11.5px;line-height:1.32;margin-top:2px}

/* Stack panel */
.stack{display:grid;gap:9px}
.stack-card{display:flex;gap:10px;align-items:flex-start;padding:13px 13px;
  border-radius:22px;cursor:pointer;transition:transform .18s}
.stack-card:active{transform:scale(.97)}
.stack-ico{width:34px;height:34px;border-radius:13px;
  background:linear-gradient(145deg,#eef5fb,#ddeaf5);
  display:grid;place-items:center;font-size:18px;flex:0 0 34px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.9)}
.stack-card b{display:block;font-size:13.5px;font-weight:800;line-height:1.15;margin-top:1px;color:var(--dark)}
.stack-card span{display:block;font-size:11px;color:var(--muted);line-height:1.3;margin-top:4px}

/* ── Operator band ── */
.op-band{display:flex;align-items:center;gap:12px;padding:14px 15px;border-radius:24px}
.op-av{width:46px;height:46px;min-width:46px;border-radius:50%;
  background:linear-gradient(145deg,#4a7fa0,#85b5cf);
  display:grid;place-items:center;color:#fff;font-weight:900;font-size:18px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.2),0 6px 16px rgba(74,127,160,.22)}
.op-info{flex:1;min-width:0}
.op-info b{display:block;font-size:14px;font-weight:800;color:var(--dark)}
.op-info span{display:block;font-size:11.5px;color:var(--muted);line-height:1.28;margin-top:3px}
.op-tail{display:flex;align-items:center;gap:9px}
.op-icon{width:38px;height:38px;border-radius:50%;
  background:linear-gradient(145deg,#f5fafd,#e0ecf5);
  display:grid;place-items:center;color:#7ba6cc;font-size:17px;
  box-shadow:inset 0 1px 0 #fff}
.op-arrow{color:#9ab4c8;font-size:20px;font-weight:700}

/* ── Section title ── */
.sec-title{display:flex;align-items:center;justify-content:space-between;margin:2px 2px 10px}
.sec-title h3{font-size:17px;font-weight:900;letter-spacing:-.03em;color:var(--dark)}
.sec-title span{font-size:11.5px;color:var(--muted)}

/* ── Shortcuts ── */
.shortcuts{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
.sc{padding:13px 10px 11px;border-radius:22px;text-align:center;cursor:pointer;
  background:var(--card);border:1px solid var(--line);
  box-shadow:var(--sh1);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  transition:transform .18s}
.sc:active{transform:scale(.96)}
.sc .ico{width:34px;height:34px;border-radius:13px;margin:0 auto 9px;
  background:linear-gradient(145deg,#ecf4fb,#dde9f5);
  display:grid;place-items:center;font-size:17px;color:#5a96c4;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.9)}
.sc b{display:block;font-size:12px;font-weight:800;line-height:1.15;color:var(--dark)}

/* ── Weather ── */
.weather{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.wx-card{padding:13px 12px;border-radius:22px;min-height:112px;position:relative;overflow:hidden;
  background:var(--card);border:1px solid var(--line);
  box-shadow:var(--sh1);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  cursor:pointer;transition:transform .18s}
.wx-card:active{transform:scale(.97)}
.wx-card:before{content:"";position:absolute;right:-14px;bottom:-16px;
  width:72px;height:72px;border-radius:50%;
  background:radial-gradient(circle,rgba(210,230,246,.45),rgba(200,222,240,.18))}
.wx-ico{font-size:30px;position:absolute;right:10px;top:12px;opacity:.9}
.wx-city{font-size:12.5px;font-weight:800;color:var(--dark);position:relative;z-index:1}
.wx-temp{font-size:28px;font-weight:900;letter-spacing:-.06em;
  color:var(--blue-dark);line-height:1;margin-top:7px;position:relative;z-index:1}
.wx-feel{font-size:10.5px;color:var(--muted);line-height:1.24;margin-top:3px;position:relative;z-index:1}
.wx-type{font-size:11.5px;color:var(--blue-dark);font-weight:700;margin-top:5px;position:relative;z-index:1}

/* ── Bottom nav ── */
.bottom{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:100%;max-width:520px;
  background:rgba(245,251,254,.95);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-top:1px solid rgba(196,215,228,.7);
  display:grid;grid-template-columns:repeat(5,1fr);gap:3px;
  padding:8px 8px calc(10px + env(safe-area-inset-bottom));z-index:25}
.tab{border:0;background:transparent;border-radius:14px;padding:7px 2px;
  color:var(--muted);font-size:10px;line-height:1.1;cursor:pointer;transition:all .18s;font-weight:600}
.tab.on{background:rgba(74,127,160,.1);color:var(--blue-dark);font-weight:900}
.tab i{display:block;font-style:normal;font-size:18px;margin-bottom:2px}

/* ── Help FAB ── */
.help-fab{position:fixed;right:max(16px,calc((100vw - 520px)/2 + 16px));
  bottom:calc(84px + env(safe-area-inset-bottom));z-index:35;
  width:56px;height:56px;border-radius:50%;border:0;
  background:radial-gradient(circle at 35% 30%,#50c0ff 0%,#2a80ff 44%,#1558d8 100%);
  color:#fff;box-shadow:0 16px 36px rgba(28,110,230,.32),inset 0 1px 0 rgba(255,255,255,.2);
  display:grid;place-items:center;cursor:pointer;transition:transform .18s}
.help-fab:active{transform:scale(.94)}
.help-fab span{font-size:24px;line-height:1;font-weight:900}
.help-fab:after{content:"";position:absolute;right:6px;top:6px;width:10px;height:10px;
  border-radius:50%;background:#39b96d;border:2px solid #fff}

/* ── Modal ── */
.modal{position:fixed;inset:0;background:rgba(8,22,36,.48);z-index:40;
  display:none;align-items:flex-end;justify-content:center}
.modal.show{display:flex}
.sheet{width:100%;max-width:520px;background:#fff;border-radius:28px 28px 0 0;
  padding:18px 18px calc(22px + env(safe-area-inset-bottom));
  max-height:82vh;overflow:auto;box-shadow:0 -24px 60px rgba(10,24,40,.24)}
.sheet h2{margin:0 0 8px;font-size:23px;letter-spacing:-.04em}
.sheet p{color:var(--muted);font-size:13.5px;line-height:1.44}
.close{border:0;background:var(--ice);border-radius:13px;padding:9px 12px;
  font-weight:800;color:var(--ink);cursor:pointer;font-size:13px}

/* ── Shared components ── */
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.small{font-size:11.5px!important;color:var(--muted)!important;line-height:1.35!important}
.badge{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:5px 9px;
  background:var(--ice);border:1px solid var(--line);font-size:11px;color:var(--ink);margin:2px;font-weight:700}
.badge.dark{background:var(--dark);color:#fff;border-color:var(--dark)}
.badge.gold{background:#fff5e6;color:#7a5020;border-color:#f0d4ae}
.badge.green{background:#ecf8f2;color:#2a7248;border-color:#cbeedd}
.badge.red{background:#fff0ef;color:#9e3c38;border-color:#ffd2cf}
.kpi{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:13px}
.kpi div{background:#fff;border:1px solid var(--line);border-radius:18px;padding:11px;text-align:center}
.kpi b{display:block;font-size:17px;color:var(--dark)}
.kpi span{display:block;font-size:10.5px;color:var(--muted);line-height:1.2;margin-top:2px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{background:#fff;border:1px solid var(--line);border-radius:22px;padding:13px;
  min-height:108px;cursor:pointer;box-shadow:0 4px 14px rgba(15,33,51,.05)}
.tile:active{transform:scale(.985)}
.tile .ico{width:37px;height:37px;border-radius:14px;background:var(--ice);
  display:grid;place-items:center;margin-bottom:9px;font-size:18px}
.tile b{display:block;font-size:13.5px;margin-bottom:4px;line-height:1.15}
.tile span{display:block;font-size:11.5px;color:var(--muted);line-height:1.3}
.btn{width:100%;border:0;border-radius:17px;background:var(--blue);color:#fff;
  padding:13px 14px;font-weight:900;font-size:14px;cursor:pointer;
  box-shadow:0 10px 24px rgba(74,127,160,.22)}
.btn.secondary{background:#fff;color:var(--blue);border:1px solid var(--line);box-shadow:none}
.btn.gold{background:var(--gold)}.btn.green{background:var(--green)}.btn.red{background:var(--red)}
.btnrow{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.chips{display:flex;gap:8px;overflow:auto;margin:0 -16px 13px;padding:0 16px 5px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;border:1px solid var(--line);border-radius:999px;background:#fff;
  padding:9px 13px;font-size:13px;color:var(--ink);font-weight:800;cursor:pointer}
.chip.on{background:var(--blue);border-color:var(--blue);color:#fff}
.notice{border-left:4px solid var(--gold);background:#fff7ea;border-radius:17px;
  padding:12px;margin-bottom:13px;color:#7a5020;font-size:12.5px;line-height:1.36}
.soft{border-left:4px solid var(--green);background:#edf8f2;border-radius:17px;
  padding:12px;margin-bottom:13px;color:#2f5240;font-size:12.5px;line-height:1.36}
.mapbox{height:330px;border:1px solid var(--line);border-radius:26px;
  background:linear-gradient(145deg,#e6f0f5,#fff);position:relative;overflow:hidden;margin-bottom:13px}
.mapbox:before{content:"";position:absolute;left:38px;right:32px;top:44px;bottom:40px;
  border:3px dashed rgba(74,127,160,.3);border-radius:47% 53% 46% 54%;transform:rotate(-13deg)}
.pin{position:absolute;width:32px;height:32px;border-radius:50% 50% 50% 8px;background:var(--blue);
  transform:rotate(-45deg);display:grid;place-items:center;color:#fff;font-weight:900;
  box-shadow:0 10px 24px rgba(15,33,51,.22);cursor:pointer}
.pin i{transform:rotate(45deg);font-style:normal}
.pin.gold{background:var(--gold)}.pin.green{background:var(--green)}.pin.red{background:var(--red)}
.item{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:10px;
  align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.thumb{width:52px;height:52px;border-radius:17px;background:var(--ice);
  display:grid;place-items:center;font-size:22px}
.item b{font-size:14px}
.item .desc{font-size:11.5px;color:var(--muted);line-height:1.3;margin-top:2px}
.price{font-weight:900;color:var(--blue);white-space:nowrap;font-size:13px}
.mini-btn{border:1px solid var(--line);background:#fff;color:var(--blue);
  border-radius:13px;padding:8px 11px;font-weight:800;font-size:12px;cursor:pointer;white-space:nowrap}
.msg{background:#fff;border:1px solid var(--line);border-radius:19px;
  padding:11px;margin:7px 0;max-width:88%}
.msg.me{background:#e4eef4;margin-left:auto}
.msg b{font-size:12.5px}
.msg div{font-size:12.5px;color:var(--ink);line-height:1.4;margin-top:3px}
input,textarea,select{width:100%;border:1px solid var(--line);background:#fff;
  border-radius:17px;padding:13px;font-family:inherit;color:var(--ink);margin:7px 0;font-size:14px}
textarea{min-height:86px;resize:vertical}
.progress{height:8px;background:#dde9f0;border-radius:99px;overflow:hidden;margin:9px 0}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--gold));border-radius:99px}
.goal{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.goal:last-child{border-bottom:0}
.check{width:30px;height:30px;border-radius:50%;background:var(--ice);
  display:grid;place-items:center;font-weight:900;color:var(--blue)}
.goal.done .check{background:var(--green);color:#fff}
.privacy{display:grid;gap:9px}
.privacy .row{background:#fff;border:1px solid var(--line);border-radius:17px;padding:10px}
.switch{min-width:42px;width:42px;height:24px;border-radius:99px;background:#d8e5ec;position:relative}
.switch:after{content:"";position:absolute;left:3px;top:3px;width:18px;height:18px;
  border-radius:50%;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.14)}
.switch.on{background:var(--blue)}
.switch.on:after{left:21px}
.hidden{display:none!important}
.stars{font-size:28px;color:var(--gold);letter-spacing:2px;margin:8px 0}
.modebar{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:13px}
.modebar button{border:1px solid var(--line);background:#fff;border-radius:17px;padding:12px;
  font-weight:900;color:var(--ink);cursor:pointer}
.modebar button.on{background:var(--dark);border-color:var(--dark);color:#fff}

/* Destination section */
.destination-card{background:#fff;border:1px solid var(--line);border-radius:24px;
  padding:14px;margin-bottom:13px;box-shadow:0 8px 24px rgba(15,33,51,.05)}
.destination-card h3{font-size:17px;margin:0 0 8px}
.destination-search{display:flex;align-items:center;gap:10px;border:1px solid var(--line);
  background:linear-gradient(145deg,#f6fbfd,#fff);border-radius:19px;padding:11px 12px;cursor:pointer}
.destination-search .search-ico{width:36px;height:36px;border-radius:14px;background:var(--ice);
  display:grid;place-items:center;font-size:17px}
.destination-search b{display:block;font-size:14px;color:var(--dark)}
.destination-search span{display:block;font-size:11.5px;color:var(--muted);line-height:1.25;margin-top:2px}
.dest-chips{display:flex;gap:8px;overflow:auto;margin:10px -2px 0;padding:0 2px 3px;scrollbar-width:none}
.dest-chips::-webkit-scrollbar{display:none}
.dest-chip{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:999px;
  padding:7px 11px;font-size:12px;font-weight:900;color:var(--ink);cursor:pointer}
.dest-chip.on{background:var(--dark);color:#fff;border-color:var(--dark)}
.weather-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:13px}
.weather-card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:12px;
  box-shadow:0 5px 16px rgba(15,33,51,.04);cursor:pointer;min-height:108px}
.weather-card:active{transform:scale(.985)}
.weather-city{font-size:12px;font-weight:900;color:var(--dark);margin-bottom:5px}
.weather-temp{font-size:23px;font-weight:900;letter-spacing:-.05em;color:var(--blue);line-height:1}
.weather-meta{font-size:10.5px;color:var(--muted);line-height:1.28;margin-top:7px}
.weather-icon{width:32px;height:32px;border-radius:13px;background:var(--ice);
  display:grid;place-items:center;margin-bottom:7px}
.weather-note{font-size:11.5px;color:var(--muted);line-height:1.3;margin:-5px 2px 10px}

.help-actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px}
.help-action{border:1px solid var(--line);background:#fff;border-radius:17px;
  padding:12px;text-align:left;cursor:pointer}
.help-action b{display:block;font-size:13px;color:var(--dark)}
.help-action span{display:block;font-size:11.5px;color:var(--muted);line-height:1.25;margin-top:3px}

@media(min-width:560px){
  .app{margin:18px auto;border-radius:36px;min-height:calc(100vh - 36px);overflow:hidden}
  .bottom{border-radius:22px 22px 0 0}
  .header{border-radius:36px 36px 0 0}
}
@media(max-width:380px){
  .dash{grid-template-columns:1fr}
  .hero-btns,.shortcuts,.weather{grid-template-columns:1fr 1fr}
  .weather .wx-card:last-child{grid-column:1/-1}
  .kpi-row .kpi-box{padding:11px}
  .home-hero h3{font-size:25px}
}
